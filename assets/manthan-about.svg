  <text x="88" y="252" font-family="'Courier New', monospace" font-size="13" fill="#22D3EE" font-weight="bold">❯</text>
  <text x="108" y="252" font-family="'Courier New', monospace" font-size="13" fill="#A78BFA" font-weight="bold">cat education.txt</text>
