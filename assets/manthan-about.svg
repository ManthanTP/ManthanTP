  <text x="88" y="332" font-family="'Courier New', monospace" font-size="13" fill="#F4F4FA" opacity="0.9">Building complete products: React 19, TypeScript, Supabase backend &amp; Gemini AI.</text>
  <text x="88" y="352" font-family="'Courier New', monospace" font-size="13" fill="#F4F4FA" opacity="0.9">Shipping full architectures — from relational DB schemas to native Android APKs.</text>

