<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="100%" role="img" aria-label="About — Manthan Patel">
  <defs>
    <linearGradient id="about-bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06060C"/>
      <stop offset="50%" stop-color="#0A0A16"/>
      <stop offset="100%" stop-color="#06060C"/>
    </linearGradient>

    <linearGradient id="about-term-header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E0E1A"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>

    <linearGradient id="about-border-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.5"/>
    </linearGradient>

    <pattern id="about-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7C3AED" stroke-opacity="0.035" stroke-width="0.5"/>
    </pattern>

    <radialGradient id="about-glow" cx="50%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="490" fill="url(#about-bg-grad)" rx="16"/>
  <rect width="1200" height="490" fill="url(#about-grid)" rx="16"/>
  <rect width="1200" height="490" fill="url(#about-glow)" rx="16"/>

  <!-- Technical Corner Brackets -->
  <path d="M 28 38 L 28 28 L 38 28" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>
  <path d="M 1172 38 L 1172 28 L 1162 28" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>
  <path d="M 28 452 L 28 462 L 38 462" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>
  <path d="M 1172 452 L 1172 462 L 1162 462" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>

  <!-- Section Tracker -->
  <text x="60" y="52" font-family="'Courier New', monospace" font-size="11" fill="#22D3EE" letter-spacing="3" opacity="0.85">02 // INTEL · DEVELOPER ARCHITECTURE</text>

  <!-- Headline -->
  <text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#F4F4FA">Hello, I'm Manthan.</text>

