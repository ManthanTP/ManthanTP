<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" role="img" aria-label="Footer — Manthan Patel">
  <defs>
    <linearGradient id="footer-bg-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07070D"/>
      <stop offset="100%" stop-color="#0E0E1A"/>
    </linearGradient>
    <linearGradient id="footer-line-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#7C3AED" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#22D3EE" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#22D3EE;#A78BFA;#22D3EE" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="1">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#7C3AED" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#22D3EE" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#22D3EE;#7C3AED;#22D3EE" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#7C3AED" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="footer-glow" x="-5%" y="-100%" width="110%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="80" fill="url(#footer-bg-grad)" rx="12"/>

  <!-- Animated gradient line -->
  <rect x="60" y="20" width="1080" height="2" rx="1" fill="url(#footer-line-grad)" filter="url(#footer-glow)"/>

  <!-- Text -->
  <text x="600" y="56" font-family="'Courier New', monospace" font-size="11" fill="#A78BFA" text-anchor="middle" letter-spacing="5" opacity="0.6">BUILD WITH INTENT · SHIP FOR REAL</text>
</svg>
