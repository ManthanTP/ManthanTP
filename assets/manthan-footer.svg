<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 135" width="100%" role="img" aria-label="Footer &amp; Connect — Manthan Patel">
  <defs>
    <linearGradient id="footer-bg-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06060C"/>
      <stop offset="50%" stop-color="#0A0A16"/>
      <stop offset="100%" stop-color="#06060C"/>
    </linearGradient>

    <!-- Animated Shimmer Laser Divider -->
    <linearGradient id="footer-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="1">
        <animate attributeName="stop-color" values="#22D3EE;#A78BFA;#22D3EE" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <filter id="footer-glow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="135" fill="url(#footer-bg-grad)" rx="12"/>

  <!-- Giant Signature Watermark -->
  <text x="600" y="85" font-family="Georgia, 'Times New Roman', serif" font-size="95" font-weight="bold" fill="#7C3AED" opacity="0.05" text-anchor="middle" letter-spacing="12">MANTHAN</text>

  <!-- Flowing Animated Laser Line -->
  <rect x="60" y="24" width="1080" height="2.5" rx="1.2" fill="url(#footer-laser)" filter="url(#footer-glow)"/>

  <!-- Section Tracker -->
  <text x="600" y="58" font-family="'Courier New', monospace" font-size="10" fill="#22D3EE" text-anchor="middle" letter-spacing="4" font-weight="bold">06 // CONNECT</text>

  <!-- Closing Headline -->
  <text x="600" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#F4F4FA" text-anchor="middle" opacity="0.9">&quot;Let's build something worth explaining.&quot;</text>

  <!-- Monospace Tagline -->
  <text x="600" y="116" font-family="'Courier New', monospace" font-size="11" fill="#A78BFA" text-anchor="middle" letter-spacing="5" opacity="0.75">BUILD WITH INTENT · SHIP FOR REAL</text>
</svg>