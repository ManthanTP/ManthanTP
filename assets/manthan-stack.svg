<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" role="img" aria-label="Tech Stack — Manthan Patel">
  <defs>
    <linearGradient id="stack-bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06060C"/>
      <stop offset="50%" stop-color="#0A0A16"/>
      <stop offset="100%" stop-color="#06060C"/>
    </linearGradient>

    <linearGradient id="stack-card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.2"/>
    </linearGradient>

    <pattern id="stack-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7C3AED" stroke-opacity="0.035" stroke-width="0.5"/>
    </pattern>

    <radialGradient id="stack-glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Shimmer Top Bars -->
    <linearGradient id="stack-accent-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="stack-accent-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="stack-accent-3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="url(#stack-bg-grad)" rx="16"/>
  <rect width="1200" height="520" fill="url(#stack-grid)" rx="16"/>
  <rect width="1200" height="520" fill="url(#stack-glow)" rx="16"/>

  <!-- Technical Corner Brackets -->
  <path d="M 28 38 L 28 28 L 38 28" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>
  <path d="M 1172 38 L 1172 28 L 1162 28" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>
  <path d="M 28 482 L 28 492 L 38 492" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>
  <path d="M 1172 482 L 1172 492 L 1162 492" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.6"/>

  <!-- Section Tracker -->
  <text x="60" y="52" font-family="'Courier New', monospace" font-size="11" fill="#22D3EE" letter-spacing="3" opacity="0.85">04 // TOOLKIT · CORE CAPABILITIES</text>

  <!-- Headline -->
  <text x="60" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#F4F4FA">The tools I reach for.</text>

  <!-- ==================== 6 MODULAR CARDS (3 cols x 2 rows) ==================== -->
  <!-- ROW 1 -->
  <!-- Card 1: Languages -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="345" height="155" rx="10" fill="#090912" stroke="url(#stack-card-border)" stroke-width="1.2"/>
    <rect x="0" y="0" width="345" height="3" rx="1.5" fill="url(#stack-accent-1)"/>
    <text x="20" y="32" font-family="'Courier New', monospace" font-size="10" fill="#22D3EE" letter-spacing="2" font-weight="bold">01 // LANGUAGES</text>
    <text x="20" y="65" font-family="'Courier New', monospace" font-size="16" fill="#F4F4FA" font-weight="bold">TypeScript · JavaScript</text>
    <text x="20" y="92" font-family="'Courier New', monospace" font-size="14" fill="#A78BFA">SQL (PostgreSQL) · HTML5/CSS3</text>
    <text x="20" y="125" font-family="'Courier New', monospace" font-size="11" fill="#22D3EE" opacity="0.8">Type safety · Relational schemas</text>
  </g>

  <!-- Card 2: Frontend & UI -->
  <g transform="translate(425, 130)">
    <rect x="0" y="0" width="345" height="155" rx="10" fill="#090912" stroke="url(#stack-card-border)" stroke-width="1.2"/>
    <rect x="0" y="0" width="345" height="3" rx="1.5" fill="url(#stack-accent-2)"/>
    <text x="20" y="32" font-family="'Courier New', monospace" font-size="10" fill="#A78BFA" letter-spacing="2" font-weight="bold">02 // FRONTEND &amp; UI</text>
    <text x="20" y="65" font-family="'Courier New', monospace" font-size="16" fill="#F4F4FA" font-weight="bold">React 19 · Vite 6</text>
    <text x="20" y="92" font-family="'Courier New', monospace" font-size="14" fill="#A78BFA">Tailwind CSS · Framer Motion</text>
    <text x="20" y="125" font-family="'Courier New', monospace" font-size="11" fill="#22D3EE" opacity="0.8">Reactive state · Micro-animations</text>
  </g>

  <!-- Card 3: Backend & Data -->
  <g transform="translate(790, 130)">
    <rect x="0" y="0" width="350" height="155" rx="10" fill="#090912" stroke="url(#stack-card-border)" stroke-width="1.2"/>
    <rect x="0" y="0" width="350" height="3" rx="1.5" fill="url(#stack-accent-3)"/>
    <text x="20" y="32" font-family="'Courier New', monospace" font-size="10" fill="#22D3EE" letter-spacing="2" font-weight="bold">03 // BACKEND &amp; DATA</text>
    <text x="20" y="65" font-family="'Courier New', monospace" font-size="16" fill="#F4F4FA" font-weight="bold">Supabase · PostgreSQL</text>
    <text x="20" y="92" font-family="'Courier New', monospace" font-size="14" fill="#A78BFA">Row-Level Security · Realtime</text>
    <text x="20" y="125" font-family="'Courier New', monospace" font-size="11" fill="#22D3EE" opacity="0.8">Auth · Channels · Storage</text>
  </g>

  <!-- ROW 2 -->
  <!-- Card 4: AI & Intelligence -->
  <g transform="translate(60, 310)">
    <rect x="0" y="0" width="345" height="155" rx="10" fill="#090912" stroke="url(#stack-card-border)" stroke-width="1.2"/>
    <rect x="0" y="0" width="345" height="3" rx="1.5" fill="url(#stack-accent-2)"/>
    <text x="20" y="32" font-family="'Courier New', monospace" font-size="10" fill="#22D3EE" letter-spacing="2" font-weight="bold">04 // AI &amp; INTELLIGENCE</text>
    <text x="20" y="65" font-family="'Courier New', monospace" font-size="16" fill="#F4F4FA" font-weight="bold">Google Gemini AI API</text>
    <text x="20" y="92" font-family="'Courier New', monospace" font-size="14" fill="#A78BFA">Prompt Engineering · Workflows</text>
    <text x="20" y="125" font-family="'Courier New', monospace" font-size="11" fill="#22D3EE" opacity="0.8">Campus assistants · Triage agents</text>
  </g>

  <!-- Card 5: Mobile & Local-First -->
  <g transform="translate(425, 310)">
    <rect x="0" y="0" width="345" height="155" rx="10" fill="#090912" stroke="url(#stack-card-border)" stroke-width="1.2"/>
    <rect x="0" y="0" width="345" height="3" rx="1.5" fill="url(#stack-accent-3)"/>
    <text x="20" y="32" font-family="'Courier New', monospace" font-size="10" fill="#A78BFA" letter-spacing="2" font-weight="bold">05 // MOBILE &amp; HYBRID</text>
    <text x="20" y="65" font-family="'Courier New', monospace" font-size="16" fill="#F4F4FA" font-weight="bold">Capacitor · Android APK</text>
    <text x="20" y="92" font-family="'Courier New', monospace" font-size="14" fill="#A78BFA">IndexedDB · PWA Standards</text>
    <text x="20" y="125" font-family="'Courier New', monospace" font-size="11" fill="#22D3EE" opacity="0.8">Offline-first · Zero latency</text>
  </g>

  <!-- Card 6: DevOps & Platform -->
  <g transform="translate(790, 310)">
    <rect x="0" y="0" width="350" height="155" rx="10" fill="#090912" stroke="url(#stack-card-border)" stroke-width="1.2"/>
    <rect x="0" y="0" width="350" height="3" rx="1.5" fill="url(#stack-accent-1)"/>
    <text x="20" y="32" font-family="'Courier New', monospace" font-size="10" fill="#22D3EE" letter-spacing="2" font-weight="bold">06 // DEVOPS &amp; TOOLS</text>
    <text x="20" y="65" font-family="'Courier New', monospace" font-size="16" fill="#F4F4FA" font-weight="bold">Git &amp; GitHub · Vercel CI/CD</text>
    <text x="20" y="92" font-family="'Courier New', monospace" font-size="14" fill="#A78BFA">Zustand · Recharts Analytics</text>
    <text x="20" y="125" font-family="'Courier New', monospace" font-size="11" fill="#22D3EE" opacity="0.8">Automated deploys · Clean metrics</text>
  </g>
</svg>